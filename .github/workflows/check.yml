name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/validate.py
      - run: node --check site_simples/app.js && node --check site_simples/relatorio.js && node --check docs/app.js
      - run: python site_simples/build/build.py
      - run: python scripts/validate.py
      - run: git diff --exit-code -- site_simples/data
