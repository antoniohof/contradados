name: Publish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python site_simples/build/build.py
      - run: python scripts/validate.py
      - name: Prepare public files
        run: |
          mkdir -p _site/data _site/mapas
          cp site_simples/index.html site_simples/app.js site_simples/relatorio.js site_simples/style.css _site/
          cp site_simples/data/*.json _site/data/
          cp -R docs/. _site/mapas/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
